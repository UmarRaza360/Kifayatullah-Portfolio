<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Marketing Portfolio</title>
    <style>
        /* Removes all margins and makes the page take up 100% of the screen */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
        }
        /* Makes the PDF viewer fill the entire window */
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>
    <!-- Embeds your specific PDF file -->
    <iframe src="My Personal Portfolio (1).pdf" title="Portfolio">
        This browser does not support PDFs. Please download the PDF to view it.
    </iframe>
</body>
</html>
